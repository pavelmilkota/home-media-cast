name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Kodi version, how you run the app (Docker or not).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: 'Remove secrets first: no .env contents, API keys, pairing codes, device tokens or provider links.'
      render: text
