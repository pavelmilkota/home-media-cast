# Stage 1: one container on the host network, next to Kodi.
# `network_mode: host` lets the API reach Kodi's JSON-RPC on 127.0.0.1:9090, which stays
# bound to loopback and is never published. Restrict who can reach the API port with ufw
# (docs/networking.md); host networking means Docker's own port publishing is not involved.
services:
  api:
    image: home-media-cast:stage1
    build: .
    network_mode: host
    restart: unless-stopped
    # Only what the API reads. Not `env_file`: that would also hand it secrets (TorBox key)
    # it does not use yet.
    environment:
      PORT: ${PORT:-8787}
      KODI_WS_URL: ${KODI_WS_URL:-ws://127.0.0.1:9090/jsonrpc}
      PLAYBACK_ALLOW_HOSTS: ${PLAYBACK_ALLOW_HOSTS:-}
      AIOSTREAMS_URL: ${AIOSTREAMS_URL:-}
      AIOSTREAMS_UUID: ${AIOSTREAMS_UUID:-}
      AIOSTREAMS_PASSWORD: ${AIOSTREAMS_PASSWORD:-}
      YOUTUBE_CAST_ENABLED: ${YOUTUBE_CAST_ENABLED:-false}
      YOUTUBE_DIAL_PORT: ${YOUTUBE_DIAL_PORT:-3100}
      YOUTUBE_DEVICE_NAME: ${YOUTUBE_DEVICE_NAME:-homeMediaCast}
      BROWSER_AHEAD_SEGMENTS: ${BROWSER_AHEAD_SEGMENTS:-12}
      BROWSER_BEHIND_SEGMENTS: ${BROWSER_BEHIND_SEGMENTS:-6}
      TRANSCODE: ${TRANSCODE:-vaapi}
      TRANSCODE_HW_DECODE: ${TRANSCODE_HW_DECODE:-false}
      TRANSCODE_VAAPI_DEVICE: ${TRANSCODE_VAAPI_DEVICE:-/dev/dri/renderD129}
      GUEST_PLAYBACK_ENABLED: ${GUEST_PLAYBACK_ENABLED:-true}
      KODI_RESTART_TRIGGER: /restart/kodi-restart
      KODI_LOG_PATH: /kodi-log
    volumes:
      - data:/data
      # Only for the "Restart Kodi" button: an empty file appears here and a host unit reacts to
      # it (docs/kodi-setup.md). The directory must exist and be writable by uid 1000.
      - ${KODI_RESTART_DIR:-./restart}:/restart
      # Kodi's log directory, read-only, for the Logs page. The directory (not the file) is mounted
      # so Kodi's rotation to kodi.old.log does not leave a stale file. It must be readable by uid
      # 1000 (docs/kodi-setup.md).
      - ${KODI_LOG_DIR:-./kodi-log}:/kodi-log:ro
    # The Intel GPU's render node, for VAAPI transcoding (docs/environment.md). The host has two
    # render nodes; pick the one whose driver is i915 (see `ls -l /sys/class/drm/renderD*/device/driver`).
    devices:
      - ${TRANSCODE_VAAPI_DEVICE:-/dev/dri/renderD129}:${TRANSCODE_VAAPI_DEVICE:-/dev/dri/renderD129}
    # Numeric GID of the host's `render` group (`getent group render`), so uid 1000 may open it.
    group_add:
      - ${RENDER_GID:?set RENDER_GID in .env (getent group render)}
    read_only: true
    # HLS segments live here, so this is RAM: size it for the ahead/behind budgets.
    tmpfs:
      - /tmp:size=${TRANSCODE_TMPFS_SIZE:-1g}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:'+(process.env.PORT||8787)+'/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  data:
